# TOAST typo-* 15종 → rootage 형식. 값은 제품 tailwind.config.js fontSize 원본 그대로 (px 규약 유지).
# 피그마 검증(2026-08-11): 폰트 정본 = SUIT (단일 폰트, OFL — 셀프호스팅 가능). 화면 실사용 분포가
#   본 15종과 정합. 미등재 후보: 디스플레이 계열 24/600·28/700·42/700, 11/700 (본 구현에서 추가 검토).
#   대형(16px+)의 피그마 행간 169% vs 코드 180% 편차는 **코드 값(1.8) 유지로 확정** (2026-08-11 유저 결정).
#   (신설 디스플레이 4종만 피그마 실측 1.7 — 화면 타이틀 용도라 의도적 구분.)
