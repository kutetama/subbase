# subBase Figma 정본 매핑 — TguHa6sJ8LimFvTMkxMoce, Foundations/Color Token(83:4013).
# 라이트 값은 Figma 원값을 사용한다. 다크 모드는 파일에 정의가 없어 동일 색상 계열로 파생했다.
# Brand Color는 실제 행동과 핵심 상태에 제한적으로 사용한다는 Figma 가이드를 따른다.
