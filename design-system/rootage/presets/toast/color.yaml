        theme-dark: "#17181B"
    # success 계열 — 가이드에 없어 신설 (2026-08-11, ML 도구 요구. AutoJudge success 그린 계승, 대비 검증 통과)
    $color.palette.success:
      values:
        theme-light: "#0B7A52"
        theme-dark: "#34C08D"
    $color.palette.success-bg:
      values:
        theme-light: "#E6F6EE"
        theme-dark: "#1E3226"
    # ── 시맨틱 층 (roles — 팔레트 참조, 모드 전환은 팔레트가 담당) ──
    $color.semantic.surface:
      values:
        theme-light: "$color.palette.white"
        theme-dark: "$color.palette.white"
    $color.semantic.surface-page:
      values:
        theme-light: "$color.palette.base-bg"
        theme-dark: "$color.palette.base-bg"
    $color.semantic.fg:
      values:
        theme-light: "$color.palette.neutral-black"
        theme-dark: "$color.palette.neutral-black"
    $color.semantic.fg-muted:
      values:
        theme-light: "$color.palette.neutral-dark-gray"
        theme-dark: "$color.palette.neutral-dark-gray"
    $color.semantic.fg-subtle:
      values:
        theme-light: "$color.palette.neutral-dark-middle-gray"
        theme-dark: "$color.palette.neutral-dark-middle-gray"
    $color.semantic.line:
      values:
        theme-light: "$color.palette.line-gray"
        theme-dark: "$color.palette.line-gray"
    $color.semantic.accent:
      values:
        theme-light: "$color.palette.primary"
        theme-dark: "$color.palette.primary"
    $color.semantic.accent-bg:
      values:
        theme-light: "$color.palette.primary-bg"
        theme-dark: "$color.palette.primary-bg"
    $color.semantic.danger:
      values:
        theme-light: "$color.palette.error"
        theme-dark: "$color.palette.error"
    $color.semantic.danger-bg:
      values:
        theme-light: "$color.palette.error-bg"
        theme-dark: "$color.palette.error-bg"
    $color.semantic.success:
      values:
        theme-light: "$color.palette.success"
        theme-dark: "$color.palette.success"
    $color.semantic.success-bg:
      values:
        theme-light: "$color.palette.success-bg"
        theme-dark: "$color.palette.success-bg"
