# claude 프리셋 — 업로드된 DESIGN-claude.md(웜 크림 캔버스 + 코랄 + 다크 네이비)를 Toastfy 토큰으로 매핑 (2026-08-12).
# 매핑 원칙:
#   - 라이트 값은 문서 원값 우선. 단 WCAG 게이트(npm run contrast) 미달 항목은 동계열에서 심화·파생하고 주석 명기.
#   - 다크 값은 문서의 다크 서피스 팔레트(#181715·#252320·#1f1e1b, on-dark #faf9f5·#a09d96)에서 파생 —
#     문서에 완전한 다크 테마가 없어 R1~R6 규칙으로 보강.
#   - 카테고리 8색(third)은 문서에 스케일이 없어 accent-teal·accent-amber를 축으로 파생 (주석).
kind: Tokens
metadata:
  id: color
  name: Color (claude)
data:
  collection: color
  tokens:
    # ── 팔레트 층 ─────────────────────────────
    $color.palette.white:            # 카드·패널 서피스 = canvas(#faf9f5)
      values: { theme-light: "#FAF9F5", theme-dark: "#252320" }   # 다크 = surface-dark-elevated
    $color.palette.primary:          # coral
      values: { theme-light: "#CC785C", theme-dark: "#CC785C" }
    $color.palette.primary-dark:     # primary-active
      values: { theme-light: "#A9583E", theme-dark: "#B96A4E" }
    $color.palette.primary-light:    # 파생 (문서 미정의 — focus·글로우용 연코랄)
      values: { theme-light: "#E2A48E", theme-dark: "#D99B84" }
    $color.palette.primary-light-bg:
      values: { theme-light: "#F6E5DD", theme-dark: "#3A2B23" }
    $color.palette.primary-bg:       # 호버·선택 틴트 (연한 코랄 크림, 파생)
      values: { theme-light: "#F8EDE6", theme-dark: "#2B211C" }
    $color.palette.primary-gradient-end:
      values: { theme-light: "#D98A6D", theme-dark: "#D98A6D" }
    $color.palette.sub:
      values: { theme-light: "#E2A48E", theme-dark: "#D99B84" }
    # 카테고리 8색 — 1·2는 문서 액센트(amber·teal), 3~8은 에디토리얼 계열 파생
    $color.palette.third-1:
      values: { theme-light: "#E8A55A", theme-dark: "#E8A55A" }
    $color.palette.third-2:
      values: { theme-light: "#5DB8A6", theme-dark: "#5DB8A6" }
    $color.palette.third-3:
      values: { theme-light: "#3E5C76", theme-dark: "#7396B4" }
    $color.palette.third-4:
      values: { theme-light: "#C64545", theme-dark: "#D96A6A" }
    $color.palette.third-5:
      values: { theme-light: "#B58AB5", theme-dark: "#B58AB5" }
    $color.palette.third-6:
      values: { theme-light: "#CC785C", theme-dark: "#CC785C" }
    $color.palette.third-7:
      values: { theme-light: "#7BA05B", theme-dark: "#8FB474" }
    $color.palette.third-8:
      values: { theme-light: "#7A766C", theme-dark: "#98948A" }
    # 뉴트럴 — ink·body·muted 계열 매핑
    $color.palette.neutral-black:    # ink
      values: { theme-light: "#141413", theme-dark: "#FAF9F5" }  # 다크 = on-dark(크림 화이트)
    $color.palette.neutral-dark-gray: # body
      values: { theme-light: "#3D3D3A", theme-dark: "#C9C5BD" }
    $color.palette.neutral-dark-middle-gray: # muted
      values: { theme-light: "#6C6A64", theme-dark: "#A09D96" }  # 다크 = on-dark-soft
    $color.palette.neutral-middle-gray: # muted-soft
      values: { theme-light: "#8E8B82", theme-dark: "#6C6A64" }
    $color.palette.neutral-light-middle-gray: # hairline
      values: { theme-light: "#E6DFD8", theme-dark: "#33312D" }
    $color.palette.neutral-light-gray: # surface-card(연크림 밴드)
      values: { theme-light: "#EFE9DE", theme-dark: "#1F1E1B" }  # 다크 = surface-dark-soft
    # 시맨틱 상태 — 문서 원값이 상태 점용이라 저대비 → 텍스트 게이트 통과 위해 라이트는 심화 파생
    $color.palette.error:
      values: { theme-light: "#C64545", theme-dark: "#E57373" }
    $color.palette.error-bg:
      values: { theme-light: "#F9E7E5", theme-dark: "#3C2523" }
    $color.palette.line-gray:        # hairline(#E6DFD8)은 서피스 대비 1.13이라 게이트(1.3) 미달 → 심화
      values: { theme-light: "#D9CFC1", theme-dark: "#3A3733" }
    $color.palette.caution:          # warning
      values: { theme-light: "#D4A017", theme-dark: "#DDAB2E" }
    $color.palette.caution-bg:
      values: { theme-light: "#F7EFD9", theme-dark: "#33301F" }
    $color.palette.base-bg:          # 페이지 플로어 = surface-soft (canvas보다 한 단계 깊은 크림)
      values: { theme-light: "#F5F0E8", theme-dark: "#181715" } # 다크 = surface-dark
    $color.palette.success:          # 문서 #5DB872는 상태 점용 저대비 → 텍스트용 심화(#37814A)
      values: { theme-light: "#37814A", theme-dark: "#6EC584" }
    $color.palette.success-bg:
      values: { theme-light: "#E7F4E9", theme-dark: "#23372A" }
    # ── 시맨틱 층 (toast와 동일 참조 구조 — 파리티 필수) ──
    $color.semantic.surface:
      values: { theme-light: "$color.palette.white", theme-dark: "$color.palette.white" }
    $color.semantic.surface-page:
      values: { theme-light: "$color.palette.base-bg", theme-dark: "$color.palette.base-bg" }
    $color.semantic.fg:
      values: { theme-light: "$color.palette.neutral-black", theme-dark: "$color.palette.neutral-black" }
    $color.semantic.fg-muted:
      values: { theme-light: "$color.palette.neutral-dark-gray", theme-dark: "$color.palette.neutral-dark-gray" }
    $color.semantic.fg-subtle:
      values: { theme-light: "$color.palette.neutral-dark-middle-gray", theme-dark: "$color.palette.neutral-dark-middle-gray" }
    $color.semantic.line:
      values: { theme-light: "$color.palette.line-gray", theme-dark: "$color.palette.line-gray" }
    $color.semantic.accent:
      values: { theme-light: "$color.palette.primary", theme-dark: "$color.palette.primary" }
    $color.semantic.accent-bg:
      values: { theme-light: "$color.palette.primary-bg", theme-dark: "$color.palette.primary-bg" }
    $color.semantic.danger:
      values: { theme-light: "$color.palette.error", theme-dark: "$color.palette.error" }
    $color.semantic.danger-bg:
      values: { theme-light: "$color.palette.error-bg", theme-dark: "$color.palette.error-bg" }
    $color.semantic.success:
      values: { theme-light: "$color.palette.success", theme-dark: "$color.palette.success" }
    $color.semantic.success-bg:
      values: { theme-light: "$color.palette.success-bg", theme-dark: "$color.palette.success-bg" }
