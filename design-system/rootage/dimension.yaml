# TOAST 컴포넌트 치수 토큰 (제품 tailwind.config.js 원본 값).
# Tailwind 커스텀 키 대신 변수로 유지 — 컴포넌트는 arbitrary px(원 키 주석) 또는 var 참조 사용.
kind: Tokens
metadata:
  id: dimension
  name: Dimension
data:
  collection: global
  tokens:
    $dimension.header-height: { values: { default: "60px" } }
    $dimension.aside-width: { values: { default: "250px" } }
    $dimension.button-min-width: { values: { default: "110px" } }
    $dimension.button-small-min-width: { values: { default: "90px" } }
    $dimension.button-min-height: { values: { default: "42px" } }
    $dimension.modal-small-min-width: { values: { default: "400px" } }
    $dimension.modal-medium-min-width: { values: { default: "768px" } }
    $dimension.modal-head-height: { values: { default: "55px" } }
    $dimension.modal-foot-height: { values: { default: "57px" } }
    $dimension.filter-width: { values: { default: "200px" } }
    $dimension.context-menu-min-width: { values: { default: "150px" } }
    $dimension.body-min-width: { values: { default: "1024px" } }
